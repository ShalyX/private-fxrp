  <text x="820" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#bd1645">BROWSER</text>
  <rect x="1000" y="265" width="800" height="445" rx="22" fill="#111820"/>
  <text x="1055" y="330" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#55d6b0">ECIES CIPHERTEXT</text>
