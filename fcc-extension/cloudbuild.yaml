steps:
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--no-cache'
      - '--build-arg'
      - 'SOURCE_DATE_EPOCH=1785878651'
      - '--build-arg'
      - 'TEE_NODE_REF=v0.0.24'
      - '--tag'
      - 'local/tee-node-base:v0.0.24'
      - '--file'
      - 'docker/node-base.Dockerfile'
      - 'docker/'
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--no-cache'
      - '--build-arg'
      - 'SOURCE_DATE_EPOCH=1785878651'
      - '--build-arg'
      - 'TEE_NODE_REF=v0.0.24'
      - '--tag'
      - 'us-west1-docker.pkg.dev/project-d79f9e62-d832-4631-9f6/private-fxrp/private-fxrp-tee:v0.4.0'
      - '--file'
      - 'typescript/Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'node'
      - 'us-west1-docker.pkg.dev/project-d79f9e62-d832-4631-9f6/private-fxrp/private-fxrp-tee:v0.4.0'
      - '--input-type=module'
      - '--eval'
      - 'await import("/app/extension/dist/app/config.js")'
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--no-cache'
      - '--tag'
      - 'us-west1-docker.pkg.dev/project-d79f9e62-d832-4631-9f6/private-fxrp/private-fxrp-proxy:v0.4.0'
      - '--file'
      - 'proxy/Dockerfile'
      - '.'
images:
  - 'us-west1-docker.pkg.dev/project-d79f9e62-d832-4631-9f6/private-fxrp/private-fxrp-tee:v0.4.0'
  - 'us-west1-docker.pkg.dev/project-d79f9e62-d832-4631-9f6/private-fxrp/private-fxrp-proxy:v0.4.0'
timeout: '1800s'
